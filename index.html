<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Betta &amp; Chill</title>
    <meta name="description" content="Sit on Chamundi Hills and watch Mysuru slow down. Scan the QR code to send birds, rain, breeze or a sunset." />
    <meta name="theme-color" content="#2a3358" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <canvas id="scene" aria-label="Illustrated view of Mysuru city from Chamundi Hills"></canvas>

    <div id="hud" class="hud">
      <div id="tray" class="tray" hidden>
        <button class="pill" type="button" data-fx="birds" title="Birds (B)">🐦</button>
        <button class="pill" type="button" data-fx="sun" title="Sunset / sunrise (S)">🌇</button>
        <button class="pill" type="button" data-fx="breeze" title="Breeze (W)">🍃</button>
        <button class="pill" type="button" data-fx="rain" title="Rain (R)">🌧️</button>
      </div>
      <div id="radio-tray" class="tray radio-tray" role="group" aria-label="Kannada radio stations" hidden></div>
      <div class="hud-row">
        <button id="btn-view" class="pill" type="button"></button>
        <button id="btn-bench" class="pill" type="button" aria-pressed="false" aria-expanded="false" aria-controls="bench-panel">🪑 Bench</button>
        <button id="btn-sound" class="pill" type="button" aria-pressed="false">🔇 Sound</button>
        <button id="btn-radio" class="pill" type="button" aria-pressed="false" aria-expanded="false" aria-controls="radio-tray" title="Pick a Kannada radio station (P = on/off, N = next) · streams via radio-browser.info, © respective stations">📻 Radio</button>
        <button id="btn-play" class="pill" type="button" aria-expanded="false" aria-controls="tray">✨ Play</button>
      </div>
    </div>

    <aside id="remote-panel" class="remote-panel" hidden>
      <button id="remote-collapse" class="remote-collapse" type="button" aria-label="Hide QR code">×</button>
      <div class="remote-body">
        <canvas id="qr" width="132" height="132" aria-label="QR code for the phone remote"></canvas>
        <div class="remote-text">
          <strong>Play with the sky</strong>
          <span>Scan to get a remote on your phone.</span>
          <span id="remote-status" class="remote-status">Connecting…</span>
        </div>
      </div>
    </aside>
    <button id="remote-pill" class="pill remote-pill" type="button" hidden>📱 Remote</button>

    <aside id="bench-panel" class="bench-panel" aria-label="Benches" hidden>
      <header class="bench-head">
        <div>
          <strong>Benches</strong>
          <span id="bench-summary" class="bench-summary"></span>
        </div>
        <button id="bench-close" class="remote-collapse" type="button" aria-label="Close benches">×</button>
      </header>
      <label class="bench-filter"><input id="bench-free" type="checkbox" /> Free seats only</label>
      <p class="bench-hint">Each bench shares one radio station. Anyone sitting there can change it.</p>
      <ol id="bench-list" class="bench-list"></ol>
    </aside>

    <div id="sit-prompt" class="sit-prompt" role="dialog" aria-label="Take a seat" hidden>
      <button id="sit-dismiss" class="sit-x" type="button" aria-label="No thanks">×</button>
      <strong>🪑 Take a seat?</strong>
      <span>Sit on a bench with others and listen to Kannada radio together.</span>
      <div class="sit-actions">
        <button id="sit-anywhere" class="pill sit-main" type="button">Sit anywhere</button>
        <button id="sit-choose" class="pill" type="button">Choose a bench</button>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
