<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Betta &amp; Chill Remote</title>
    <meta name="theme-color" content="#1c2238" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body class="remote">
    <main class="remote-main">
      <header>
        <h1>Betta &amp; Chill</h1>
        <p id="status" class="status">Connecting…</p>
      </header>
      <div class="grid">
        <button class="ctl" data-cmd="birds" disabled><span class="ico">🐦</span><span class="lbl">Birds</span><span class="bar"></span></button>
        <button class="ctl" data-cmd="sun" disabled><span class="ico">🌇</span><span class="lbl">Sunset</span><span class="bar"></span></button>
        <button class="ctl" data-cmd="breeze" disabled><span class="ico">🍃</span><span class="lbl">Breeze</span><span class="bar"></span></button>
        <button class="ctl" data-cmd="rain" disabled><span class="ico">🌧️</span><span class="lbl">Rain</span><span class="bar"></span></button>
      </div>
      <section class="radio" aria-label="Kannada radio">
        <div class="radio-head">
          <span class="radio-ico">📻</span>
          <div class="radio-text">
            <strong id="radio-station">Kannada radio</strong>
            <span id="radio-note" class="radio-note">Off</span>
          </div>
        </div>
        <div class="radio-ctls">
          <button class="rbtn" data-radio="prev" aria-label="Previous station" disabled>⏮</button>
          <button class="rbtn rbtn-main" data-radio="toggle" aria-label="Play or pause radio" disabled>▶</button>
          <button class="rbtn" data-radio="next" aria-label="Next station" disabled>⏭</button>
        </div>
        <label class="radio-vol">
          <span aria-hidden="true">🔈</span>
          <input id="radio-vol" type="range" min="0" max="100" step="1" value="70" aria-label="Radio volume" disabled />
          <span aria-hidden="true">🔊</span>
        </label>
        <p class="radio-credit">Streams via radio-browser.info · © respective stations</p>
      </section>
      <p class="hint">Watch the big screen ✨</p>
    </main>
    <script type="module" src="/src/remote/main.ts"></script>
  </body>
</html>
