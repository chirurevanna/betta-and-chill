<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Betta & Chill app icon: a listener in headphones on a bench, against a dusk sky over the hill.
       Full-bleed square (the OS rounds the corners); everything that matters sits inside the
       maskable safe zone (a circle of radius ~205 around the centre). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1942"/>
      <stop offset="0.38" stop-color="#4b3d7c"/>
      <stop offset="0.6" stop-color="#b5708c"/>
      <stop offset="0.74" stop-color="#f0a57c"/>
      <stop offset="0.76" stop-color="#f6c08a"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3dc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff6e6">
    <circle cx="112" cy="92" r="3"/>
    <circle cx="196" cy="140" r="2.2"/>
    <circle cx="150" cy="200" r="1.8"/>
    <circle cx="272" cy="86" r="2.4"/>
    <circle cx="430" cy="232" r="2"/>
  </g>

  <!-- moon -->
  <circle cx="368" cy="138" r="78" fill="url(#moonGlow)"/>
  <circle cx="368" cy="138" r="34" fill="#fff3dc"/>

  <!-- distant city lights along the horizon -->
  <g fill="#ffd79a">
    <circle cx="78" cy="372" r="2.6"/><circle cx="104" cy="380" r="2"/><circle cx="132" cy="370" r="2.4"/>
    <circle cx="388" cy="376" r="2.4"/><circle cx="414" cy="368" r="2"/><circle cx="440" cy="378" r="2.6"/>
  </g>

  <!-- the hill -->
  <path d="M0 404 C 90 378, 170 386, 256 392 S 420 380, 512 398 V512 H0 Z" fill="#17142e"/>

  <!-- lamp post with a warm glow -->
  <circle cx="378" cy="262" r="60" fill="url(#lamp)"/>
  <rect x="374" y="262" width="7" height="132" rx="3" fill="#100e24"/>
  <circle cx="377.5" cy="262" r="10" fill="#ffe2ad"/>

  <!-- listener: hoodie seen from behind, headphones -->
  <path d="M206 342 C 202 314, 210 290, 228 286 L 268 286 C 286 290, 294 314, 290 342 Z" fill="#9caf88"/>
  <circle cx="248" cy="262" r="22" fill="#1b1410"/>
  <path d="M222 262 A 26 26 0 0 1 274 262" fill="none" stroke="#f5b971" stroke-width="7" stroke-linecap="round"/>
  <rect x="216" y="254" width="13" height="22" rx="6" fill="#f5b971"/>
  <rect x="267" y="254" width="13" height="22" rx="6" fill="#f5b971"/>

  <!-- bench: backrest slats in front of the listener, legs on the hill -->
  <g fill="#100e24">
    <rect x="148" y="318" width="216" height="15" rx="4"/>
    <rect x="148" y="341" width="216" height="13" rx="4"/>
    <rect x="140" y="364" width="232" height="9" rx="3"/>
    <rect x="160" y="318" width="11" height="78" rx="3"/>
    <rect x="341" y="318" width="11" height="78" rx="3"/>
  </g>
</svg>
